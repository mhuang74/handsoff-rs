name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.4.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  APP_NAME: HandsOff
  BUNDLE_ID: com.handsoff.inputlock

jobs:
  build-macos-dmg-arm64:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5

    - name: Get version from tag
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag }}"
        else
          TAG=${GITHUB_REF#refs/tags/}
        fi
        VERSION=${TAG#v}
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin

    - name: Install cargo-bundle
      run: cargo install cargo-bundle --version 0.6.1 --locked

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-release-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: |
        cargo build --release --target aarch64-apple-darwin --verbose

    - name: Create app bundle
      run: |
        cargo bundle --release --target aarch64-apple-darwin --bin handsoff-tray

        # Rename bundle to proper case if needed
        BUNDLE_PATH="target/aarch64-apple-darwin/release/bundle/osx/handsoff.app"
        FINAL_BUNDLE_PATH="target/aarch64-apple-darwin/release/bundle/osx/${{ env.APP_NAME }}.app"

        if [ -d "$BUNDLE_PATH" ] && [ ! -d "$FINAL_BUNDLE_PATH" ]; then
          mv "$BUNDLE_PATH" "$FINAL_BUNDLE_PATH"
        fi

        # Fix Info.plist to add LSUIElement (menu bar only app)
        plutil -insert LSUIElement -bool true "$FINAL_BUNDLE_PATH/Contents/Info.plist"
        echo "Added LSUIElement to Info.plist"
        plutil -p "$FINAL_BUNDLE_PATH/Contents/Info.plist" | grep -E "(LSUIElement|CFBundleDisplayName)"

    - name: Package CLI binary
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        DIST_DIR="dist"
        CLI_DIR="handsoff-cli"
        CLI_BINARY="target/aarch64-apple-darwin/release/handsoff"
        TARBALL="${DIST_DIR}/handsoff-cli-v${VERSION}-arm64.tar.gz"

        echo "Packaging CLI binary..."

        # Create staging directory
        mkdir -p "${CLI_DIR}"

        # Copy CLI binary
        cp "${CLI_BINARY}" "${CLI_DIR}/"

        # Create tarball
        mkdir -p "${DIST_DIR}"
        tar -czf "${TARBALL}" "${CLI_DIR}"

        # Clean up staging directory
        rm -rf "${CLI_DIR}"

        echo "CLI tarball created at: ${TARBALL}"
        ls -lh "${TARBALL}"

    - name: Create DMG
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        BUNDLE_PATH="target/aarch64-apple-darwin/release/bundle/osx/${{ env.APP_NAME }}.app"
        DIST_DIR="dist"
        DMG_STAGING="target/aarch64-apple-darwin/release/dmg-staging"
        DMG_FINAL="${DIST_DIR}/${{ env.APP_NAME }}-v${VERSION}-arm64.dmg"

        echo "Building DMG..."

        # Ad-hoc sign (unsigned distribution, ADR 0001)
        codesign --deep --force --sign - "${BUNDLE_PATH}"

        # Stage app + Applications symlink
        rm -rf "${DMG_STAGING}"
        mkdir -p "${DMG_STAGING}"
        cp -R "${BUNDLE_PATH}" "${DMG_STAGING}/"
        ln -s /Applications "${DMG_STAGING}/Applications"
        mkdir -p "${DIST_DIR}"

        hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "${DMG_STAGING}" -ov -format UDZO "${DMG_FINAL}"
        rm -rf "${DMG_STAGING}"

        echo "DMG created at: ${DMG_FINAL}"
        ls -lh "${DMG_FINAL}"

    - name: Upload DMG as artifact
      uses: actions/upload-artifact@v5
      with:
        name: handsoff-dmg-macos-arm64
        path: dist/${{ env.APP_NAME }}-v${{ steps.version.outputs.version }}-arm64.dmg
        retention-days: 30

    - name: Upload CLI tarball as artifact
      uses: actions/upload-artifact@v5
      with:
        name: handsoff-cli-macos-arm64
        path: dist/handsoff-cli-v${{ steps.version.outputs.version }}-arm64.tar.gz
        retention-days: 30

  build-macos-dmg-x86_64:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5

    - name: Get version from tag
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag }}"
        else
          TAG=${GITHUB_REF#refs/tags/}
        fi
        VERSION=${TAG#v}
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-apple-darwin

    - name: Install cargo-bundle
      run: cargo install cargo-bundle --version 0.6.1 --locked

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-release-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: |
        cargo build --release --target x86_64-apple-darwin --verbose

    - name: Create app bundle
      run: |
        cargo bundle --release --target x86_64-apple-darwin --bin handsoff-tray

        # Rename bundle to proper case if needed
        BUNDLE_PATH="target/x86_64-apple-darwin/release/bundle/osx/handsoff.app"
        FINAL_BUNDLE_PATH="target/x86_64-apple-darwin/release/bundle/osx/${{ env.APP_NAME }}.app"

        if [ -d "$BUNDLE_PATH" ] && [ ! -d "$FINAL_BUNDLE_PATH" ]; then
          mv "$BUNDLE_PATH" "$FINAL_BUNDLE_PATH"
        fi

        # Fix Info.plist to add LSUIElement (menu bar only app)
        plutil -insert LSUIElement -bool true "$FINAL_BUNDLE_PATH/Contents/Info.plist"
        echo "Added LSUIElement to Info.plist"
        plutil -p "$FINAL_BUNDLE_PATH/Contents/Info.plist" | grep -E "(LSUIElement|CFBundleDisplayName)"

    - name: Package CLI binary
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        DIST_DIR="dist"
        CLI_DIR="handsoff-cli"
        CLI_BINARY="target/x86_64-apple-darwin/release/handsoff"
        TARBALL="${DIST_DIR}/handsoff-cli-v${VERSION}-x86_64.tar.gz"

        echo "Packaging CLI binary..."

        # Create staging directory
        mkdir -p "${CLI_DIR}"

        # Copy CLI binary
        cp "${CLI_BINARY}" "${CLI_DIR}/"

        # Create tarball
        mkdir -p "${DIST_DIR}"
        tar -czf "${TARBALL}" "${CLI_DIR}"

        # Clean up staging directory
        rm -rf "${CLI_DIR}"

        echo "CLI tarball created at: ${TARBALL}"
        ls -lh "${TARBALL}"

    - name: Create DMG
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        BUNDLE_PATH="target/x86_64-apple-darwin/release/bundle/osx/${{ env.APP_NAME }}.app"
        DIST_DIR="dist"
        DMG_STAGING="target/x86_64-apple-darwin/release/dmg-staging"
        DMG_FINAL="${DIST_DIR}/${{ env.APP_NAME }}-v${VERSION}-x86_64.dmg"

        echo "Building DMG..."

        # Ad-hoc sign (unsigned distribution, ADR 0001)
        codesign --deep --force --sign - "${BUNDLE_PATH}"

        # Stage app + Applications symlink
        rm -rf "${DMG_STAGING}"
        mkdir -p "${DMG_STAGING}"
        cp -R "${BUNDLE_PATH}" "${DMG_STAGING}/"
        ln -s /Applications "${DMG_STAGING}/Applications"
        mkdir -p "${DIST_DIR}"

        hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "${DMG_STAGING}" -ov -format UDZO "${DMG_FINAL}"
        rm -rf "${DMG_STAGING}"

        echo "DMG created at: ${DMG_FINAL}"
        ls -lh "${DMG_FINAL}"

    - name: Upload DMG as artifact
      uses: actions/upload-artifact@v5
      with:
        name: handsoff-dmg-macos-x86_64
        path: dist/${{ env.APP_NAME }}-v${{ steps.version.outputs.version }}-x86_64.dmg
        retention-days: 30

    - name: Upload CLI tarball as artifact
      uses: actions/upload-artifact@v5
      with:
        name: handsoff-cli-macos-x86_64
        path: dist/handsoff-cli-v${{ steps.version.outputs.version }}-x86_64.tar.gz
        retention-days: 30

  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
    - uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0

    - name: Get version from tag
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag }}"
        else
          TAG=${GITHUB_REF#refs/tags/}
        fi
        VERSION=${TAG#v}
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Build Changelog
      id: changelog
      uses: mikepenz/release-changelog-builder-action@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        configuration: |
          {
            "pr_template": "- #{{TITLE}} (#{{NUMBER}})",
            "commit_template": "- #{{TITLE}}",
            "categories": [
              {
                "title": "### Added",
                "labels": ["feature", "enhancement", "added"]
              },
              {
                "title": "### Fixed",
                "labels": ["bug", "fix", "fixed"]
              },
              {
                "title": "### Changed",
                "labels": ["refactor", "chore", "changed"]
              }
            ],
            "template": "#{{CHANGELOG}}",
            "empty_template": "- No changes"
          }

    - name: Update CHANGELOG.md
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        DATE=$(date +%Y-%m-%d)

        # Read current CHANGELOG (skip first 2 lines: title and blank line)
        if [ -f CHANGELOG.md ]; then
          tail -n +3 CHANGELOG.md > CHANGELOG.tmp
        fi

        # Create new CHANGELOG with new version at top
        echo "# Changelog" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## [${VERSION}] - ${DATE}" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "${{steps.changelog.outputs.changelog}}" >> CHANGELOG.md
        echo "" >> CHANGELOG.md

        # Append old content
        if [ -f CHANGELOG.tmp ]; then
          cat CHANGELOG.tmp >> CHANGELOG.md
          rm CHANGELOG.tmp
        fi

        echo "CHANGELOG.md updated with version ${VERSION}"
        cat CHANGELOG.md | head -20

    - name: Commit CHANGELOG.md
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add CHANGELOG.md

        if git diff --staged --quiet; then
          echo "No changes to CHANGELOG.md"
        else
          git commit -m "docs: update CHANGELOG.md for ${{ steps.version.outputs.tag }}"
          git push origin main
          echo "CHANGELOG.md committed and pushed"
        fi

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build-macos-dmg-arm64, build-macos-dmg-x86_64, changelog]

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        pattern: handsoff-*-macos-*
        merge-multiple: true
        path: dist

    - name: Generate release notes
      run: |
        cat > release_notes.md << 'EOF'
        ## HandsOff v${{ needs.changelog.outputs.version }}

        ${{ needs.changelog.outputs.changelog }}

        ---

        See full [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for all versions.

        EOF

        cat release_notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.changelog.outputs.tag }}
        name: Release ${{ needs.changelog.outputs.tag }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        files: |
          dist/${{ env.APP_NAME }}-v${{ needs.changelog.outputs.version }}-arm64.dmg
          dist/${{ env.APP_NAME }}-v${{ needs.changelog.outputs.version }}-x86_64.dmg
          dist/handsoff-cli-v${{ needs.changelog.outputs.version }}-arm64.tar.gz
          dist/handsoff-cli-v${{ needs.changelog.outputs.version }}-x86_64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload release bundles as artifact
      uses: actions/upload-artifact@v5
      with:
        name: release-bundles
        path: |
          dist/${{ env.APP_NAME }}-v${{ needs.changelog.outputs.version }}-arm64.dmg
          dist/${{ env.APP_NAME }}-v${{ needs.changelog.outputs.version }}-x86_64.dmg
          dist/handsoff-cli-v${{ needs.changelog.outputs.version }}-arm64.tar.gz
          dist/handsoff-cli-v${{ needs.changelog.outputs.version }}-x86_64.tar.gz
        retention-days: 30
